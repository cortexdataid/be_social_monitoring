services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: be_social_monitoring_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - social_net

  nginx:
    image: nginx:alpine
    container_name: be_social_monitoring_nginx
    restart: unless-stopped
    ports:
      - '8083:80'
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - social_net
    depends_on:
      - app

networks:
  social_net:
    driver: bridge